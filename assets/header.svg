<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Ahsaan Munir, Full-Stack and AI Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b18"/>
      <stop offset="0.55" stop-color="#0d1530"/>
      <stop offset="1" stop-color="#170f33"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#8be9fd"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045"/>
    </pattern>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
    <clipPath id="term"><rect x="82" y="216" width="636" height="56" rx="11"/></clipPath>
  </defs>

  <style>
    .sans { font-family: 'Segoe UI', Inter, Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: 'Cascadia Code', Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace; }
    .orb1 { animation: drift1 14s ease-in-out infinite alternate; }
    .orb2 { animation: drift2 18s ease-in-out infinite alternate; }
    @keyframes drift1 { from { transform: translate(0, 0); } to { transform: translate(120px, 40px); } }
    @keyframes drift2 { from { transform: translate(0, 0); } to { transform: translate(-140px, -30px); } }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
    .blink { animation: blink 1s linear infinite; }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }

    .g1 { animation: show1 12s linear infinite; }
    .g2 { animation: show2 12s linear infinite; }
    .g3 { animation: show3 12s linear infinite; }
    .c1 { animation: type1 12s steps(28, end) infinite; }
    .c2 { animation: type2 12s steps(26, end) infinite; }
    .c3 { animation: type3 12s steps(24, end) infinite; }

    @keyframes show1 { 0%, 30% { opacity: 1; } 30.01%, 100% { opacity: 0; } }
    @keyframes show2 { 0%, 33.33% { opacity: 0; } 33.34%, 63.33% { opacity: 1; } 63.34%, 100% { opacity: 0; } }
    @keyframes show3 { 0%, 66.66% { opacity: 0; } 66.67%, 96.66% { opacity: 1; } 96.67%, 100% { opacity: 0; } }

    @keyframes type1 { 0% { transform: translateX(0); } 13.33%, 26.67% { transform: translateX(403.2px); } 30%, 100% { transform: translateX(0); } }
    @keyframes type2 { 0%, 33.33% { transform: translateX(0); } 46.67%, 60% { transform: translateX(374.4px); } 63.33%, 100% { transform: translateX(0); } }
    @keyframes type3 { 0%, 66.66% { transform: translateX(0); } 80%, 93.33% { transform: translateX(345.6px); } 96.66%, 100% { transform: translateX(0); } }

    @media (prefers-reduced-motion: reduce) {
      .orb1, .orb2, .pulse, .blink, .g2, .g3, .c2, .c3 { animation: none; }
      .g1 { animation: none; opacity: 1; }
      .c1 { animation: none; transform: translateX(403.2px); }
      .g2, .g3 { opacity: 0; }
    }
  </style>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>
  <g filter="url(#blur)">
    <circle class="orb1" cx="260" cy="60" r="140" fill="#06b6d4" fill-opacity="0.35"/>
    <circle class="orb2" cx="980" cy="260" r="160" fill="#7c3aed" fill-opacity="0.35"/>
  </g>

  <!-- status pill -->
  <rect x="80" y="44" width="408" height="30" rx="15" fill="#ffffff" fill-opacity="0.06" stroke="#22d3ee" stroke-opacity="0.35"/>
  <circle class="pulse" cx="98" cy="59" r="4.5" fill="#22c55e"/>
  <text x="112" y="64" class="sans" font-size="13" letter-spacing="2" fill="#a5f3fc">OPEN TO FULL-TIME AND FREELANCE WORK</text>

  <!-- name and title -->
  <text x="78" y="148" class="sans" font-size="66" font-weight="700" fill="url(#name)">Ahsaan Munir</text>
  <text x="80" y="188" class="sans" font-size="20" fill="#c7d2fe">Full-Stack &amp; AI Engineer · Lahore, Pakistan</text>

  <!-- terminal -->
  <rect x="80" y="214" width="640" height="60" rx="12" fill="#0a0f1f" stroke="#334155"/>
  <text x="104" y="252" class="mono" font-size="20" fill="#22d3ee">~/ahsaan</text>
  <text x="204" y="252" class="mono" font-size="20" fill="#f472b6">$</text>
  <g clip-path="url(#term)">
    <g class="g1">
      <text x="230" y="253" class="mono" font-size="24" fill="#e2e8f0" textLength="403.2" lengthAdjust="spacingAndGlyphs">MERN apps live in production</text>
      <rect class="c1" x="228" y="226" width="420" height="38" fill="#0a0f1f"/>
      <g class="c1"><rect class="blink" x="231" y="230" width="3" height="30" fill="#22d3ee"/></g>
    </g>
    <g class="g2">
      <text x="230" y="253" class="mono" font-size="24" fill="#e2e8f0" textLength="374.4" lengthAdjust="spacingAndGlyphs">Python, FastAPI and Django</text>
      <rect class="c2" x="228" y="226" width="400" height="38" fill="#0a0f1f"/>
      <g class="c2"><rect class="blink" x="231" y="230" width="3" height="30" fill="#22d3ee"/></g>
    </g>
    <g class="g3">
      <text x="230" y="253" class="mono" font-size="24" fill="#e2e8f0" textLength="345.6" lengthAdjust="spacingAndGlyphs">RAG, voice agents and ML</text>
      <rect class="c3" x="228" y="226" width="370" height="38" fill="#0a0f1f"/>
      <g class="c3"><rect class="blink" x="231" y="230" width="3" height="30" fill="#22d3ee"/></g>
    </g>
  </g>

  <!-- network on the right -->
  <g stroke="#94a3b8" stroke-opacity="0.25" stroke-width="1.2">
    <line x1="860" y1="96" x2="962" y2="64"/>
    <line x1="962" y1="64" x2="1062" y2="112"/>
    <line x1="860" y1="96" x2="912" y2="190"/>
    <line x1="962" y1="64" x2="1012" y2="208"/>
    <line x1="912" y1="190" x2="1012" y2="208"/>
    <line x1="1062" y1="112" x2="1012" y2="208"/>
    <line x1="1062" y1="112" x2="1120" y2="226"/>
    <line x1="1012" y1="208" x2="1120" y2="226"/>
  </g>
  <circle class="pulse" cx="860" cy="96" r="6" fill="#22d3ee"/>
  <circle class="pulse" cx="962" cy="64" r="7" fill="#a78bfa" style="animation-delay:.4s"/>
  <circle class="pulse" cx="1062" cy="112" r="6" fill="#22d3ee" style="animation-delay:.8s"/>
  <circle class="pulse" cx="912" cy="190" r="5" fill="#a78bfa" style="animation-delay:1.2s"/>
  <circle class="pulse" cx="1012" cy="208" r="8" fill="#22d3ee" style="animation-delay:1.6s"/>
  <circle class="pulse" cx="1120" cy="226" r="5" fill="#f472b6" style="animation-delay:2s"/>
</svg>
